spring.application.name=demo

# Oracle Autonomous Database
spring.datasource.url=jdbc:oracle:thin:@(description= (retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.sa-santiago-1.oraclecloud.com))(connect_data=(service_name=g165a88e9544870_backend3db_tp.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))
spring.datasource.username=BANKXYZ_APP
spring.datasource.password=${BANKXYZ_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Spring Batch
spring.batch.job.enabled=true
spring.batch.job.name=estadosCuentaAnualesJob
spring.batch.jdbc.initialize-schema=never
spring.batch.jdbc.isolation-level-for-create=READ_COMMITTED

app.totalRecords=1000
app.poolSize=3
app.maxSkipCount=100

# Apache Kafka
spring.kafka.bootstrap-servers=localhost:9092
# producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=latest
