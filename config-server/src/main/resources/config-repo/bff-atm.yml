server:
  port: 8083

bankxyz:
  backend:
    url: http://localhost:8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

resilience4j:

  retry:
    instances:
      backendRetry:
        maxAttempts: 3
        waitDuration: 1s

  bulkhead:
    instances:
      backendBulkhead:
        maxConcurrentCalls: 5
        maxWaitDuration: 0

  circuitbreaker:
    instances:
      circuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  timelimiter:
    instances:
      circuitBreaker:
        timeoutDuration: 10s

bff:
  channel: atm
  jwt:
    issuer: bff-atm
    scope: ATM
    expiration-seconds: 1800